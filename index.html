<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A calculator built with plain HTML, CSS and JavaScript." />
  <title>Calculator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff8a1f'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif'%3E%3D%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display">
      <div class="expression" id="expression" aria-live="polite"></div>
      <div class="result" id="result" aria-live="polite">0</div>
    </div>

    <div class="keys">
      <button type="button" class="key fn" data-action="clear">AC</button>
      <button type="button" class="key fn" data-value="(">(</button>
      <button type="button" class="key fn" data-value=")">)</button>
      <button type="button" class="key op" data-value="÷" aria-label="Divide">÷</button>

      <button type="button" class="key" data-value="7">7</button>
      <button type="button" class="key" data-value="8">8</button>
      <button type="button" class="key" data-value="9">9</button>
      <button type="button" class="key op" data-value="×" aria-label="Multiply">×</button>

      <button type="button" class="key" data-value="4">4</button>
      <button type="button" class="key" data-value="5">5</button>
      <button type="button" class="key" data-value="6">6</button>
      <button type="button" class="key op" data-value="−" aria-label="Subtract">−</button>

      <button type="button" class="key" data-value="1">1</button>
      <button type="button" class="key" data-value="2">2</button>
      <button type="button" class="key" data-value="3">3</button>
      <button type="button" class="key op" data-value="+" aria-label="Add">+</button>

      <button type="button" class="key fn" data-value="%">%</button>
      <button type="button" class="key" data-value="0">0</button>
      <button type="button" class="key" data-value=".">.</button>
      <button type="button" class="key equals" data-action="equals" aria-label="Equals">=</button>

      <button type="button" class="key fn wide" data-action="backspace" aria-label="Delete last character">⌫ Delete</button>
    </div>

    <section class="history" aria-label="History">
      <h2>History</h2>
      <ul id="history"></ul>
    </section>
  </main>

  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
